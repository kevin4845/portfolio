<section id="top" class="relative flex min-h-[calc(100svh-4rem)] items-end md:items-center">
  <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <div class="hero-atmosphere absolute inset-0"></div>
    <div class="hero-grid absolute inset-0"></div>
  </div>

  <div class="site-container relative w-full min-w-0 py-[clamp(3.5rem,8vh,5.5rem)]">
    <p class="hero-enter text-xs font-medium tracking-[0.18em] text-faint uppercase">
      {{ 'hero.eyebrow' | transloco }}
    </p>
    <h1 class="hero-enter hero-title font-medium text-ink">
      @for (line of nameLines(); track $index; let first = $first) {
        @if (!first) {
          <br class="sm:hidden" />
        }
        <span>{{ first ? line : ' ' + line }}</span>
      }
    </h1>
    <p class="hero-enter-late hero-lead leading-relaxed text-muted">
      {{ 'hero.lead' | transloco }}
    </p>
    <div class="hero-enter-late hero-actions flex flex-col gap-3 sm:flex-row">
      <a class="btn btn-primary group" routerLink="/" fragment="projects">
        {{ 'hero.primaryCta' | transloco }}
        <svg class="arrow size-4" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.25" />
        </svg>
      </a>
      <a class="btn btn-secondary" routerLink="/" fragment="contact">
        {{ 'hero.secondaryCta' | transloco }}
      </a>
    </div>
  </div>
</section>
